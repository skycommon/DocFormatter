name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 仅构建 + 上传 artifact；release 由 token 通过 API 手动创建（描述完全可控，避免与自动发版冲突）
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        shell: cmd
        run: |
          python -m venv venv314
          .\venv314\Scripts\python.exe -m pip install --upgrade pip
          .\venv314\Scripts\python.exe -m pip install -r requirements-dev.txt

      - name: Build exe (PyInstaller)
        shell: cmd
        run: |
          .\venv314\Scripts\pyinstaller.exe --noconfirm DocFormatter.spec
          if not exist dist\DocFormatter.exe (
            echo [ERROR] exe not generated
            exit /b 1
          )

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocFormatter-${{ github.ref_name }}
          path: dist/DocFormatter.exe
          if-no-files-found: error